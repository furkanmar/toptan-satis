services:
  postgres:
    image: postgres:16-alpine
    container_name: wholesale_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wholesaledb}
      POSTGRES_USER: ${POSTGRES_USER:-wholesale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wholesale} -d ${POSTGRES_DB:-wholesaledb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wholesale_api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-wholesaledb};Username=${POSTGRES_USER:-wholesale};Password=${POSTGRES_PASSWORD:-changeme}
      Jwt__Secret: ${JWT_SECRET:-supersecretkey_changeme_min32chars!!}
      Jwt__Issuer: ${JWT_ISSUER:-marifoglu.trade}
      Jwt__Audience: ${JWT_AUDIENCE:-marifoglu.trade}
      Seq__Url: http://seq:80
      R2__AccountId: ${R2_ACCOUNT_ID}
      R2__AccessKeyId: ${R2_ACCESS_KEY_ID}
      R2__SecretAccessKey: ${R2_SECRET_ACCESS_KEY}
      R2__BucketName: ${R2_BUCKET_NAME:-marifoglu-media}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "5001:8080"
    volumes:
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pg-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: wholesale_pgbackup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-wholesale}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-wholesaledb}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-marifoglu-backups}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wholesale_frontend
    ports:
      - "5100:80"
    depends_on:
      - api
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: wholesale_seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
  seq_data:
  backup_data:
