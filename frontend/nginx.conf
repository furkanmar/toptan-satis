server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — tüm rotalar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — Flutter web + React aynı origin üzerinden
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Origin header'ını backend'e ilet — CORS middleware görsün
        proxy_set_header Origin $http_origin;

        # OPTIONS preflight nginx'te yanıtlanırsa backend'e ulaşmaz,
        # bu yüzden preflight'ı da backend'e geçir
        proxy_pass_request_headers on;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
